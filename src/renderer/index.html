<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VoiceScribe — Professional offline Speech-to-Text for Windows. Supports English and Bengali." />
  <title>VoiceScribe — Offline Speech to Text</title>

  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- Titlebar drag region -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-logo">
      <span class="titlebar-icon">🎙️</span>
      <span class="titlebar-name">VoiceScribe</span>
    </div>
    <div class="titlebar-status" id="titlebar-status">Ready</div>
  </div>

  <!-- Main App Layout -->
  <div class="app-layout">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <label class="sidebar-label" for="language-select">Language</label>
        <div class="language-selector">
          <button class="lang-btn active" id="lang-en" data-lang="en">
            <span class="lang-flag">🇬🇧</span>
            <span>English</span>
          </button>
          <button class="lang-btn" id="lang-bn" data-lang="bn">
            <span class="lang-flag">🇧🇩</span>
            <span>বাংলা</span>
          </button>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Model Status</label>
        <div class="model-status-card" id="model-status-card">
          <div class="model-status-indicator" id="model-indicator"></div>
          <div class="model-status-text">
            <div class="model-name" id="model-name">whisper-base</div>
            <div class="model-detail" id="model-detail">Not loaded</div>
          </div>
        </div>
        <div class="download-progress-wrap" id="download-progress-wrap" style="display:none">
          <div class="download-label" id="download-label">Downloading model…</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
          <div class="progress-pct" id="progress-pct">0%</div>
        </div>
        <div class="model-actions" id="model-actions" style="display:none">
          <button class="model-action-btn" id="btn-clear-cache" title="Clear downloaded model files and reload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
            Clear cache
          </button>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Recording Info</label>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-icon">⏱</span>
            <div>
              <div class="info-value" id="recording-time">00:00</div>
              <div class="info-key">Duration</div>
            </div>
          </div>
          <div class="info-item">
            <span class="info-icon">🔊</span>
            <div>
              <div class="info-value" id="word-count">0</div>
              <div class="info-key">Words</div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Settings</label>
        <div class="setting-row">
          <span class="setting-label">Auto-copy on done</span>
          <label class="toggle-switch">
            <input type="checkbox" id="auto-copy-toggle" />
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Append mode</span>
          <label class="toggle-switch">
            <input type="checkbox" id="append-mode-toggle" />
            <span class="toggle-thumb"></span>
          </label>
        </div>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

      <!-- Waveform Visualizer -->
      <section class="visualizer-section" id="visualizer-section">
        <div class="visualizer-container">
          <div class="waveform" id="waveform" aria-label="Audio level visualizer">
            <!-- 32 bars generated by JS -->
          </div>
          <div class="visualizer-ring" id="visualizer-ring"></div>
        </div>

        <!-- Recording Controls -->
        <div class="recording-controls">
          <button class="ctrl-btn ctrl-btn-secondary" id="btn-pause" disabled title="Pause Recording">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>

          <button class="record-btn" id="btn-record" title="Start Recording">
            <div class="record-btn-inner">
              <div class="record-icon" id="record-icon"></div>
            </div>
          </button>

          <button class="ctrl-btn ctrl-btn-secondary" id="btn-stop" disabled title="Stop & Transcribe">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
            </svg>
          </button>
        </div>

        <div class="state-label" id="state-label">Click the mic to start recording</div>
      </section>

      <!-- Transcript Area -->
      <section class="transcript-section">
        <div class="transcript-header">
          <h1 class="transcript-title">Transcript</h1>
          <div class="transcript-actions">
            <button class="action-btn" id="btn-copy" title="Copy to Clipboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
              Copy
            </button>
            <button class="action-btn" id="btn-save" title="Save as .txt file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              Save
            </button>
            <button class="action-btn action-btn-danger" id="btn-clear" title="Clear transcript">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4h6v2"/>
              </svg>
              Clear
            </button>
          </div>
        </div>

        <div class="transcript-body">
          <textarea
            class="transcript-textarea"
            id="transcript-textarea"
            placeholder="Your transcribed text will appear here…&#10;&#10;Start by selecting a language, then click the microphone button to begin recording."
            spellcheck="true"
            aria-label="Transcript output"
          ></textarea>
          <div class="transcript-overlay" id="transcript-overlay" style="display:none">
            <div class="spinner"></div>
            <div class="overlay-label" id="overlay-label">Transcribing…</div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- App entry point -->
  <script type="module" src="app.js"></script>
</body>
</html>
